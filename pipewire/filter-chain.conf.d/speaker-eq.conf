# Speaker correction for the ThinkPad's built-in speakers (laptop only; install.sh links it
# and enables filter-chain.service). A WirePlumber smart filter: audio headed for the
# speaker sink passes through it, and headphones, HDMI and Bluetooth bypass it. It is
# hidden from the default-sink choice; the Sound dropdown hides it by node name.
#
# Small downward-firing drivers: drop the lows they can only distort on, lift what they
# can play, cut the plastic boxiness, add presence and air. The preamp keeps peaks clear
# of the boosts (no limiter: that needs an LV2 plugin).
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Speaker EQ"
            media.name       = "Speaker EQ"
            filter.graph = {
                nodes = [
                    { type = builtin name = preamp   label = bq_highshelf control = { "Freq" = 0.0    "Q" = 1.0   "Gain" = -3.0 } }
                    { type = builtin name = highpass label = bq_highpass  control = { "Freq" = 150.0  "Q" = 0.707 } }
                    { type = builtin name = warmth   label = bq_peaking   control = { "Freq" = 220.0  "Q" = 1.4   "Gain" = 3.0 } }
                    { type = builtin name = boxiness label = bq_peaking   control = { "Freq" = 500.0  "Q" = 1.2   "Gain" = -2.5 } }
                    { type = builtin name = presence label = bq_peaking   control = { "Freq" = 3000.0 "Q" = 1.0   "Gain" = 2.0 } }
                    { type = builtin name = air      label = bq_highshelf control = { "Freq" = 8000.0 "Q" = 0.707 "Gain" = 2.0 } }
                ]
                links = [
                    { output = "preamp:Out"   input = "highpass:In" }
                    { output = "highpass:Out" input = "warmth:In" }
                    { output = "warmth:Out"   input = "boxiness:In" }
                    { output = "boxiness:Out" input = "presence:In" }
                    { output = "presence:Out" input = "air:In" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name         = "speaker_eq"
                media.class       = Audio/Sink
                filter.smart      = true
                filter.smart.name = "speaker-eq"
                filter.smart.target = { node.name = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Speaker__sink" }
            }
            playback.props = {
                node.name    = "speaker_eq.output"
                node.passive = true
            }
        }
    }
]
