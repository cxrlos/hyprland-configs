<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Apple Color Emoji as the `emoji` generic + a LAST-RESORT fallback for the
       text generics. Uses <default> (append), NOT <prefer> / binding="strong" —
       otherwise the emoji font (which also covers the ASCII digits 0-9 for keycap
       emoji) wins for plain digits and renders them at the wrong height next to
       the real font. <default> only catches glyphs no text font provides. -->
  <alias>
    <family>emoji</family>
    <prefer><family>Apple Color Emoji</family></prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <default><family>Apple Color Emoji</family></default>
  </alias>
  <alias>
    <family>serif</family>
    <default><family>Apple Color Emoji</family></default>
  </alias>
  <alias>
    <family>monospace</family>
    <default><family>Apple Color Emoji</family></default>
  </alias>
</fontconfig>
