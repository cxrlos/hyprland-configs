# ─────────────────────────────────────────────
#  animations.conf — open/close only, everything else instant
#  Moves, resizes, workspace switches, and border color all stay at 0.
# ─────────────────────────────────────────────

animations {
    enabled = true

    bezier = quickFade, 0.15, 0.9, 0.1, 1

    animation = windowsIn, 1, 1, quickFade, popin 95%
    animation = windowsOut, 1, 1, quickFade, popin 95%
    animation = fadeIn, 1, 1, quickFade
    animation = fadeOut, 1, 1, quickFade

    animation = windowsMove, 0
    animation = workspaces, 0
    animation = border, 0
    animation = borderangle, 0
}
