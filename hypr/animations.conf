# ─────────────────────────────────────────────
#  animations.conf — fast + tasteful
#  popin windows · slidefade workspaces · glide on tiling · animated border
# ─────────────────────────────────────────────

animations {
    enabled = true

    bezier = snap, 0.2, 1, 0.3, 1
    bezier = line, 0, 0, 1, 1

    animation = windows,     1, 3,   snap, popin 80%
    animation = windowsOut,  1, 3,   snap, popin 80%
    animation = windowsMove, 1, 2,   snap
    animation = fade,        0
    animation = workspaces,  1, 3,   snap, slidefade 15%
    animation = layers,      1, 2,   snap, fade
    animation = borderangle, 1, 30,  line, loop
}
