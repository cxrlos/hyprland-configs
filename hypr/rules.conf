# ── Browser: workspace 2 (any profile) ────────
windowrule {
    name       = zen-workspace
    match:class = ^(zen|zen-browser|zen-alpha)$
    workspace  = 2
}

# ── Utility floats (translucent) ──────────────
windowrule {
    name    = pavucontrol-float
    match:class = ^(pavucontrol)$
    float   = yes
    opacity = $glass
}

windowrule {
    name    = nm-float
    match:class = ^(nm-connection-editor)$
    float   = yes
    opacity = $glass
}

# ── Scratchpad terminal (Super+`) ─────────────
windowrule {
    name    = scratchpad
    match:class = ^(scratchpad)$
    float   = yes
    size    = $size_md
    center  = yes
    opacity = $glass_term
}

# ── Floating terminal (Super+T) ───────────────
windowrule {
    name    = float-term
    match:class = ^(float-term)$
    float   = yes
    size    = $size_lg
    center  = yes
    opacity = $glass_term
}

# ── btop scratchpad (Super+M) ─────────────────
windowrule {
    name    = btop-scratch
    match:class = ^(btop-scratch)$
    float   = yes
    size    = $size_lg
    center  = yes
    opacity = $glass_term
}

# ── wiremix scratchpad (Waybar audio click) ────
windowrule {
    name    = wiremix-scratch
    match:class = ^(wiremix-scratch)$
    float   = yes
    size    = $size_md
    center  = yes
    opacity = $glass_term
}

# ── ratatoist (Super+Shift+T) ──────────────────
windowrule {
    name    = ratatoist-float
    match:class = ^(ratatoist-float)$
    float   = yes
    size    = $size_md
    center  = yes
    opacity = $glass_term
}

# ── bluetui (Super+Shift+B) ───────────────────
windowrule {
    name    = bluetui-float
    match:class = ^(bluetui-float)$
    float   = yes
    size    = $size_sm
    center  = yes
    opacity = $glass_term
}

# ── nmtui wifi (Waybar network click) ─────────
windowrule {
    name    = nmtui-float
    match:class = ^(nmtui-float)$
    float   = yes
    size    = $size_md
    center  = yes
    opacity = $glass_term
}

# ── nwg-displays (screen layout GUI) ──────────
windowrule {
    name    = nwg-displays-float
    match:class = ^(nwg-displays)$
    float   = yes
    size    = $size_md
    center  = yes
    opacity = $glass
}

# ── Picture-in-picture ────────────────────────
windowrule {
    name    = pip
    match:title = ^(Picture-in-Picture)$
    float   = yes
    pin     = yes
    size    = 30% 30%
    move    = 68% 68%
}

# ── Layer blur (frosted chrome) ───────────────
layerrule {
    name         = waybar-blur
    match:namespace = waybar
    blur         = 1
}

layerrule {
    name         = rofi-blur
    match:namespace = rofi
    blur         = 1
}

layerrule {
    name         = swaync-cc-blur
    match:namespace = swaync-control-center
    blur         = 1
}

layerrule {
    name         = swaync-notif-blur
    match:namespace = swaync-notification-window
    blur         = 1
}
