# ─────────────────────────────────────────────
#  rules.conf — Categorized Window & Layer Rules
# ─────────────────────────────────────────────

# ── Workspace Routing ────────────────────────
windowrule {
    name        = firefox-workspace
    match:class = ^([Ff]irefox)$
    workspace   = 2
}

# ── Gaming Windows: Lowest Latency + Zero Overhead ──
# Tearing enabled; animations and blur bypassed for full presentation throughput
windowrule {
    name        = gaming-performance
    match:class = ^(steam_app_.*|gamescope|.*\.exe|.*\.EXE)$
    immediate   = yes
    no_anim     = yes
    no_blur     = yes
}

# ── Scratchpads ───────────────────────────────
windowrule {
    name        = scratchpad
    match:class = ^(scratchpad)$
    float       = yes
    size        = $size_md
    center      = yes
}

windowrule {
    name        = btop-scratch
    match:class = ^(btop-scratch)$
    float       = yes
    size        = $size_lg
    center      = yes
}

windowrule {
    name        = wiremix-scratch
    match:class = ^(wiremix-scratch)$
    float       = yes
    size        = $size_md
    center      = yes
}

windowrule {
    name        = bluetui-float
    match:class = ^(bluetui-float)$
    float       = yes
    size        = $size_sm
    center      = yes
}

windowrule {
    name        = nmtui-float
    match:class = ^(nmtui-float)$
    float       = yes
    size        = $size_md
    center      = yes
}

# ── Floating System Utilities ────────────────
windowrule {
    name        = pavucontrol-float
    match:class = ^(pavucontrol)$
    float       = yes
}

windowrule {
    name        = nm-float
    match:class = ^(nm-connection-editor)$
    float       = yes
}

# ── Media & Overlays ─────────────────────────
windowrule {
    name        = pip
    match:title = ^(Picture-in-Picture)$
    float       = yes
    pin         = yes
    size        = 30% 30%
    move        = 68% 68%
}
