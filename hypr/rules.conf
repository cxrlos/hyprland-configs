# ─────────────────────────────────────────────
#  rules.conf — Categorized Window & Layer Rules
# ─────────────────────────────────────────────

# ── Workspace Routing ────────────────────────
windowrule {
    name        = zen-workspace
    match:class = ^(zen|zen-browser|zen-alpha)$
    workspace   = 2
}

# ── Gaming Windows: Lowest Latency + Zero Overhead ──
# Tearing enabled; animations and blur bypassed for full presentation throughput
windowrule {
    name        = gaming-performance
    match:class = ^(steam_app_.*|gamescope|.*\.exe|.*\.EXE)$
    immediate   = yes
    no_anim     = yes
    no_blur     = yes
}

# ── Scratchpads & Floating Terminals ─────────
windowrule {
    name        = scratchpad
    match:class = ^(scratchpad)$
    float       = yes
    size        = $size_md
    center      = yes
    opacity     = $glass_term
}

windowrule {
    name        = float-term
    match:class = ^(float-term)$
    float       = yes
    size        = $size_lg
    center      = yes
    opacity     = $glass_term
}

windowrule {
    name        = btop-scratch
    match:class = ^(btop-scratch)$
    float       = yes
    size        = $size_lg
    center      = yes
    opacity     = $glass_term
}

windowrule {
    name        = wiremix-scratch
    match:class = ^(wiremix-scratch)$
    float       = yes
    size        = $size_md
    center      = yes
    opacity     = $glass_term
}

windowrule {
    name        = ratatoist-float
    match:class = ^(ratatoist-float)$
    float       = yes
    size        = $size_md
    center      = yes
    opacity     = $glass_term
}

windowrule {
    name        = bluetui-float
    match:class = ^(bluetui-float)$
    float       = yes
    size        = $size_sm
    center      = yes
    opacity     = $glass_term
}

windowrule {
    name        = nmtui-float
    match:class = ^(nmtui-float)$
    float       = yes
    size        = $size_md
    center      = yes
    opacity     = $glass_term
}

# ── Floating System Utilities ────────────────
windowrule {
    name        = pavucontrol-float
    match:class = ^(pavucontrol)$
    float       = yes
    opacity     = $glass
}

windowrule {
    name        = nm-float
    match:class = ^(nm-connection-editor)$
    float       = yes
    opacity     = $glass
}

windowrule {
    name        = nwg-displays-float
    match:class = ^(nwg-displays)$
    float       = yes
    size        = $size_md
    center      = yes
    opacity     = $glass
}

# ── Media & Overlays ─────────────────────────
windowrule {
    name        = pip
    match:title = ^(Picture-in-Picture)$
    float       = yes
    pin         = yes
    size        = 30% 30%
    move        = 68% 68%
}

# ── Layer Surface Blur ───────────────────────
# (waybar-blur stripped to eliminate compositor shader passes on flat solid bar)
layerrule {
    name            = rofi-blur
    match:namespace = rofi
    blur            = 1
}

layerrule {
    name            = swaync-cc-blur
    match:namespace = swaync-control-center
    blur            = 1
}

layerrule {
    name            = swaync-notif-blur
    match:namespace = swaync-notification-window
    blur            = 1
}
