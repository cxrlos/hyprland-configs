general {
    lock_cmd         = pidof hyprlock || hyprlock
    # Any sleep (lid close, menu, idle) locks first and ends caffeine, so it never outlives a suspend.
    # Not via lock_cmd: hyprlock's fade-in starts from a screencopy of the desktop, and sleep is
    # released on the first locked frame, so the panel would wake on that desktop frame. Without
    # the fade it locks straight to an opaque frame.
    before_sleep_cmd = { pidof hyprlock || hyprlock --no-fade-in --immediate-render; } & ~/.config/scripts/caffeine.sh off
    after_sleep_cmd  = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    ignore_dbus_inhibit    = false
    ignore_systemd_inhibit = false   # caffeine.sh pauses idle with `systemd-inhibit --what=idle`
    inhibit_sleep          = 3       # hold sleep until the session lock is confirmed
}

# 10 min → lock
listener {
    timeout    = 600
    on-timeout = loginctl lock-session
}

# 15 min → monitor off (DPMS)
listener {
    timeout    = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 30 min → suspend (then hibernate where it is set up, e.g. the laptop; plain suspend elsewhere)
listener {
    timeout    = 1800
    on-timeout = systemctl suspend-then-hibernate || systemctl suspend
}

# Laptop on battery (on-battery.sh fails everywhere else): dim at 4 min, lock at 5,
# screen off at 7, suspend at 15. The AC timers above still run on top of these.
# on-resume fires on AC too; the marker keeps it from restoring an older dim's saved level.
listener {
    timeout    = 240
    on-timeout = ~/.config/scripts/on-battery.sh && brightnessctl -sq set 30% && touch "$XDG_RUNTIME_DIR/idle-dimmed"
    on-resume  = rm "$XDG_RUNTIME_DIR/idle-dimmed" 2>/dev/null && brightnessctl -rq
}

listener {
    timeout    = 300
    on-timeout = ~/.config/scripts/on-battery.sh && loginctl lock-session
}

listener {
    timeout    = 420
    on-timeout = ~/.config/scripts/on-battery.sh && hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout    = 900
    on-timeout = ~/.config/scripts/on-battery.sh && { systemctl suspend-then-hibernate || systemctl suspend; }
}
