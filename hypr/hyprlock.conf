# Gruvbox
# base #282828  surface #3c3836  overlay #504945
# muted #7c6f64  subtle #a89984  text #ebdbb2
# love #fb4934  gold #fabd2f  foam #8ec07c

background {
    monitor    =
    path       = color
    color      = rgba(40,40,40,1.0)
}

# ── Clock + date chip (boxy, matches waybar's module style) ────────
shape {
    monitor      =
    size         = 340, 150
    color        = rgba(60,56,54,0.6)
    rounding     = 0
    border_size  = 1
    # Same Gruvbox overlay value as regreet.css's `border: 1px solid #504945`,
    # just expressed in hyprlang's rgb() syntax instead of CSS hex.
    border_color = rgb(504945)

    position = 0, 40
    halign   = center
    valign   = center
}

# ── Clock ──────────────────────────────────────────
label {
    monitor     =
    text        = $TIME
    color       = rgb(ebdbb2)
    font_size   = 64
    font_family = Mononoki Nerd Font

    position = 0, 100
    halign   = center
    valign   = center
}

# ── Date ───────────────────────────────────────────
label {
    monitor     =
    text        = cmd[update:60000] date +'%A, %B %-d'
    color       = rgb(a89984)
    font_size   = 18
    font_family = Mononoki Nerd Font

    position = 0, 30
    halign   = center
    valign   = center
}

# ── Password input ─────────────────────────────────
input-field {
    monitor  =
    size     = 320, 52

    outline_thickness = 2
    dots_size         = 0.3
    dots_spacing      = 0.15
    dots_center       = true

    outer_color = rgb(ebdbb2)
    inner_color = rgb(504945)
    font_color  = rgb(ebdbb2)

    fade_on_empty    = true
    fade_timeout     = 1000
    placeholder_text = <span foreground="##a89984">󰌾 password</span>

    rounding     = 0
    check_color  = rgb(ebdbb2)
    fail_color   = rgb(fb4934)
    fail_text    = <span foreground="##fb4934"><i>$FAIL  ($ATTEMPTS)</i></span>
    fail_transition = 300
    # hyprlock's shape {} blocks are static and have no fail-state-conditional
    # variant (only input-field exposes fail_color/fail_text) — a thicker
    # outline-on-fail is not achievable here without inventing unsupported keys.
    capslock_color  = rgb(fabd2f)

    position = 0, -60
    halign   = center
    valign   = center
}
