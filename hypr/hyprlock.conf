# Neutral chrome lock screen: blurred wallpaper, Inter clock, photo + pill password field.
# The wallpaper path is the symlink wallpaper.sh keeps pointing at waypaper's pick.

general {
    hide_cursor        = true
    ignore_empty_input = true
}

animations {
    enabled   = true
    bezier    = easeOut, 0.25, 1, 0.5, 1
    animation = fadeIn, 1, 3, easeOut
    animation = fadeOut, 1, 3, easeOut
    animation = inputFieldDots, 1, 2, easeOut
    animation = inputFieldColors, 1, 3, easeOut
}

background {
    monitor     =
    path        = ~/.cache/wallpaper/current
    color       = rgb(1c1c1e)
    blur_passes = 3
    blur_size   = 12
    brightness  = 0.62
    vibrancy    = 0.1
}

label {
    monitor     =
    text        = cmd[update:60000] date +'%A, %-d %B'
    color       = rgba(ffffffd9)
    font_size   = 22
    font_family = Inter Medium

    position = 0, -150
    halign   = center
    valign   = top
}

label {
    monitor     =
    text        = $TIME
    color       = rgba(ffffffeb)
    font_size   = 150
    font_family = Inter SemiBold

    position = 0, -190
    halign   = center
    valign   = top
}

# ~/.face: a square photo of the user.
image {
    monitor     =
    path        = ~/.face
    size        = 84
    rounding    = -1
    border_size = 0

    position = 0, 200
    halign   = center
    valign   = bottom
}

label {
    monitor     =
    text        = Carlos
    color       = rgba(ffffffe6)
    font_size   = 15
    font_family = Inter SemiBold

    position = 0, 150
    halign   = center
    valign   = bottom
}

input-field {
    monitor =
    size    = 280, 40

    outline_thickness = 1
    outer_color       = rgba(ffffff24)
    inner_color       = rgba(ffffff24)
    font_color        = rgba(ffffffe6)
    font_family       = Inter
    check_color       = rgba(83a598ff)
    fail_color        = rgba(ff6961ff)
    capslock_color    = rgba(ffd60aff)

    rounding     = -1
    dots_size    = 0.22
    dots_spacing = 0.3
    dots_center  = true

    fade_on_empty    = false
    placeholder_text = <span foreground="##ffffff99">Enter password</span>
    fail_text        = <span foreground="##ff6961">$FAIL</span>

    position = 0, 90
    halign   = center
    valign   = bottom
}
