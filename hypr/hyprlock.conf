# Catppuccin Mocha
# base #1e1e2e  surface0 #313244  text #cdd6f4
# sky #89dceb  overlay0 #6c7086
# subtext0 #a6adc8  red #f38ba8  yellow #f9e2af

background {
    monitor     =
    path        = screenshot
    blur_passes = 3
    blur_size   = 8
    brightness  = 0.5
    vibrancy    = 0.2
    color       = rgba(30, 30, 46, 1.0)
}

# ── Clock ──────────────────────────────────────────
label {
    monitor     =
    text        = $TIME
    color       = rgb(cdd6f4)
    font_size   = 64
    font_family = MonaspiceNe Nerd Font

    position = 0, 100
    halign   = center
    valign   = center
}

# ── Date ───────────────────────────────────────────
label {
    monitor     =
    text        = cmd[update:60000] date +'%A, %B %-d'
    color       = rgb(a6adc8)
    font_size   = 18
    font_family = MonaspiceNe Nerd Font

    position = 0, 30
    halign   = center
    valign   = center
}

# ── Password input ─────────────────────────────────
input-field {
    monitor  =
    size     = 320, 52

    outline_thickness = 2
    dots_size         = 0.3
    dots_spacing      = 0.15
    dots_center       = true

    outer_color = rgb(89dceb)
    inner_color = rgb(313244)
    font_color  = rgb(cdd6f4)

    fade_on_empty    = true
    fade_timeout     = 1000
    placeholder_text = <span foreground="##a6adc8">󰌾  password</span>

    rounding     = 12
    check_color  = rgb(89dceb)
    fail_color   = rgb(f38ba8)
    fail_text    = <span foreground="##f38ba8"><i>$FAIL  ($ATTEMPTS)</i></span>
    fail_transition = 300
    capslock_color  = rgb(f9e2af)

    position = 0, -60
    halign   = center
    valign   = center
}
