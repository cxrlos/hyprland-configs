# ─────────────────────────────────────────────
#  monitors.conf — desktop: single 2560x1080 @ 60 Hz (21:9 ultrawide)
#
#  The catch-all below applies to whatever is connected. To pin a specific
#  connector, replace it with e.g.:
#    monitor = DP-1,2560x1080@60,0x0,1
#
#  Find connector names with:
#    hyprctl monitors    (while Hyprland is running)
#    wlr-randr           (any time)
# ─────────────────────────────────────────────

monitor = HDMI-A-1, 2560x1080@60, 0x0, 1, vrr, 0

