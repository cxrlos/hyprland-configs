source = ~/.config/hypr/theme.conf
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/animations.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/rules.conf

# ── Autostart ────────────────────────────────
exec-once = waybar
exec-once = ~/.config/scripts/wallpaper.sh
exec-once = swaync
exec-once = wl-paste --watch cliphist store
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = hypridle

# ── Scratchpads (pre-started, toggled with Super+`) ─────────────────────────
exec-once = [workspace special:scratch silent] alacritty --class scratchpad

# ── Environment ──────────────────────────────
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Catppuccin-Mocha-Dark-Cursors
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11,*
env = SDL_VIDEODRIVER,wayland,x11
env = SDL_HAPTIC_DISABLED,1
env = DXVK_FRAME_RATE,60
env = CLUTTER_BACKEND,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = COLORTERM,truecolor

# ── General ──────────────────────────────────
general {
    gaps_in = $gap_in
    gaps_out = $gap_out
    border_size = 2

    col.active_border = $border_active
    col.inactive_border = $border_inactive

    layout = dwindle
    allow_tearing = false
    resize_on_border = true
}

# ── Decoration ───────────────────────────────
decoration {
    rounding = $rounding

    active_opacity     = 1.0
    inactive_opacity   = 1.0
    fullscreen_opacity = 1.0

    blur {
        enabled = false
    }

    shadow {
        enabled = false
    }
}

# ── Input ────────────────────────────────────
input {
    kb_layout     = us
    follow_mouse  = 2
    repeat_delay  = 250
    repeat_rate   = 40
    sensitivity   = 0.0
    accel_profile = flat
}

# ── Cursor ───────────────────────────────────
cursor {
    no_hardware_cursors  = true
    enable_hyprcursor    = true
    sync_gsettings_theme = true
}

# ── Misc ─────────────────────────────────────
misc {
    force_default_wallpaper  = 0
    disable_hyprland_logo    = true
    disable_splash_rendering = true
    focus_on_activate        = false
    mouse_move_enables_dpms   = true
    key_press_enables_dpms    = true
    enable_swallow            = true
    swallow_regex             = ^(Alacritty)$
    vrr = 0  # 0 = off, 1 = always on, 2 = fullscreen only
}

# ── Layout: dwindle ───────────────────────────
dwindle {
    preserve_split = true
    force_split    = 2
}

# ── MX Master 3S (Logi Bolt Receiver) ────────
device {
    name = logitech-usb-receiver-mouse
    sensitivity = 0.0
    accel_profile = adaptive   # Tames 125Hz polling packet jitter
    scroll_factor = 0.3        # Drops hyper-sensitive scroll speed down to 30%
}
