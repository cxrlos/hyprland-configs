# ─────────────────────────────────────────────
#  theme.conf — Rose Pine + design tokens
#
#  Single source of truth for the Hyprland side. Sourced first by
#  hyprland.conf so it and rules.conf can reference these variables.
#  Layer-shell apps (waybar / rofi / swaync) and hyprlock are separate
#  processes and keep their own copy of the palette.
# ─────────────────────────────────────────────

# ── Palette (Rose Pine) ──
$base    = rgb(191724)
$surface = rgb(1f1d2e)
$overlay = rgb(26233a)
$muted   = rgb(6e6a86)
$text    = rgb(e0def4)
$foam    = rgb(9ccfd8)
$love    = rgb(eb6f92)

# ── Borders (Flat Solid Hex — No Gradient Loops) ──
$border_active   = rgb(9ccfd8)
$border_inactive = rgb(26233a)

# ── Layout tokens (Tight Compact Padding) ──
$gap_in   = 2
$gap_out  = 4
$rounding = 0

# ── Scratchpad / float size tokens (w% h%) ──
$size_sm = 55% 55%
$size_md = 75% 68%
$size_lg = 88% 82%
