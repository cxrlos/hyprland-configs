# ─────────────────────────────────────────────
#  theme.conf — Catppuccin Mocha + design tokens
#
#  Single source of truth for the Hyprland side. Sourced first by
#  hyprland.conf so it and rules.conf can reference these variables.
#  Layer-shell apps (waybar / rofi / swaync) and hyprlock are separate
#  processes and keep their own copy of the palette.
# ─────────────────────────────────────────────

# ── Palette (Catppuccin Mocha) ──
$base     = rgb(1e1e2e)
$mantle   = rgb(181825)
$surface0 = rgb(313244)
$overlay0 = rgb(6c7086)
$text     = rgb(cdd6f4)
$sky      = rgb(89dceb)
$red      = rgb(f38ba8)

# ── Borders ──
# sky → sapphire gradient, rotated by the borderangle animation
$border_active   = rgba(89dcebff) rgba(74c7ecff) 45deg
$border_inactive = rgba(6c7086aa)

# ── Layout tokens ──
$gap_in   = 4
$gap_out  = 8
$rounding = 8

# ── Opacity tokens (active inactive) ──
$glass      = 0.92 0.92
$glass_term = 0.95 0.95

# ── Scratchpad / float size tokens (w% h%) ──
$size_sm = 55% 55%
$size_md = 75% 68%
$size_lg = 88% 82%
