devices: (
{
    name: "MX Master 3S";

    // Native 1600 DPI provides fast, crisp tracking without sensor jitter
    dpi: 1600;

    // SmartShift ratchet/ratchetless auto-switch threshold (lower = more sensitive)
    smartshift: {
        on: true;
        threshold: 15;
    };

    // Native high-resolution smooth scrolling for Wayland/libinput
    hiresscroll: {
        hires: true;
        invert: false;
        target: false;
    };

    // Disable power management drops on the Logi Bolt connection
    divert_keys: [];
}
);
