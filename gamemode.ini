# QUICK FIX (2026-09-21) — stopgap only, not a full resolution.
# gamemoded has been failing silently on every launch (confirmed via
# `journalctl --user -u gamemoded`). Two separate causes, neither fixable
# from this file alone — see the comments next to each below. The real
# fixes are one-time system changes outside this repo (group membership +
# a root-owned /etc/gamemode.ini); this commit only corrects what's wrong
# in-repo (gpu_device) and documents the rest so it isn't a mystery again.

[general]
reaper_freq=5
desiredgov=performance
igpu_desiredgov=performance
softrealtime=auto

# renice=10 asks gamemoded to renice game processes to nice -10; ioprio=0
# asks for best-effort IO class at max priority. Both require this user
# account to be a member of the `gamemode` group, which grants the negative
# nice value via /etc/security/limits.d/10-gamemode.conf (`@gamemode - nice
# -10`). Group is currently empty (`getent group gamemode`) — until fixed,
# gamemoded logs "Permission denied" for every client process and neither
# setting does anything. Fix: `sudo usermod -aG gamemode $USER`, then log
# out/in (group membership only applies to new sessions).
renice=10
ioprio=0

# NOT APPLIED FROM THIS FILE. gamemoded only honors [gpu] (GPU perf-level,
# device selection) from a config path it trusts as root-owned/unwritable
# by the user; this file is a symlink into a user-owned dotfiles repo, so
# it's classified "unsafe" and the whole section is silently dropped
# ("The [gpu] config section is not configurable from unsafe config files!"
# in the journal). gpu_device below was also just wrong — this system's AMD
# GPU is /sys/class/drm/card1 (verified: card1/device/vendor = 0x1002),
# not card0, which is why gamemoded additionally logged "Couldn't open
# vendor file at /sys/class/drm/card0/device/vendor". Fixed here as the
# source of truth, but it still won't take effect until these three lines
# are copied into a real root-owned /etc/gamemode.ini (NOT a symlink back
# to this repo — that would still resolve to a user-owned file and fail
# the same trust check).
[gpu]
apply_gpu_optimisations=accept-responsibility
gpu_device=1
amd_performance_level=high

[cpu]
park_cores=no

[custom]
start=/home/cxrlos/.config/scripts/gamemode-start.sh
end=/home/cxrlos/.config/scripts/gamemode-end.sh
