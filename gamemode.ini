# renice/ioprio need this user in the `gamemode` group. gamemoded ignores [gpu]
# from user-owned files like this one, so the AMD GPU settings live in the
# root-owned /etc/gamemode.ini instead (gpu_device=1 → /sys/class/drm/card1).

[general]
reaper_freq=5
desiredgov=performance
igpu_desiredgov=performance
softrealtime=auto
renice=10
ioprio=0

[cpu]
park_cores=no

[custom]
start=/home/cxrlos/.config/scripts/gamemode-start.sh
end=/home/cxrlos/.config/scripts/gamemode-end.sh
